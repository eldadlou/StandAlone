name: Unity Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  editmode-tests:
    name: EditMode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: game-ci/unity-test-runner@v4
        id: editmode
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.0.47f1
          projectPath: .
          testMode: editmode
          artifactsPath: TestResults/EditMode

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EditMode-test-results
          path: TestResults/EditMode

  playmode-tests:
    name: PlayMode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: game-ci/unity-test-runner@v4
        id: playmode
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.0.47f1
          projectPath: .
          testMode: playmode
          artifactsPath: TestResults/PlayMode

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PlayMode-test-results
          path: TestResults/PlayMode
